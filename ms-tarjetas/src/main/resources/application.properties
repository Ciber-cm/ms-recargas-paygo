# Nombre del servicio (asi te vera tu compa\u00f1ero en Eureka y en OpenFeign)
spring.application.name=ms-tarjetas

# Puerto (ajusta si tu grupo acordo otro)
server.port=8200

# Base de datos MySQL (ajusta el nombre de la BD, usuario y clave a los tuyos)
spring.datasource.url=jdbc:mysql://localhost:5510/tarjetasdb?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
