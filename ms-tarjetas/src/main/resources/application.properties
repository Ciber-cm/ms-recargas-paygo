
spring.application.name=ms-tarjetas


server.port=8200


spring.datasource.url=jdbc:mysql://localhost:5510/tarjetasdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
